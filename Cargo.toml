[package]
name = "rg-md"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sub-100ms Markdown-formatted ripgrep search, context packing, and code extraction CLI for AI agents"
authors = ["Ivan M <SpIvanM>"]
repository = "https://github.com/SpIvanM/rg-md"

[[bin]]
name = "rg-md"
path = "src/main.rs"

[lib]
name = "rg_md"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
ignore = "0.4"
once_cell = "1.19"
rayon = "1.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
